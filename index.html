<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>貫入 — 釉に走るひびと墨染めのシミュレーター</title>
  <meta name="description" content="陶器の釉面に細かな亀裂が自律的に走り、時間とともに墨が染み込んでいく「貫入」を Three.js で再現するシミュレーター。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="stage" aria-label="貫入が走る茶碗の3D表示"></canvas>

  <header class="title">
    <h1>貫入</h1>
    <p class="title-sub">釉に走る、静かなひび</p>
    <span class="seal" aria-hidden="true">窯</span>
  </header>

  <main class="panel" aria-label="窯の操作">
    <section class="readout" aria-live="polite">
      <p class="label">釉面温度</p>
      <p class="temp"><span id="temp">1230</span><small>℃</small></p>
      <p class="phase" id="phase">窯出し</p>
      <dl class="stats">
        <div><dt>ひびの起点</dt><dd id="count">0</dd></div>
        <div><dt>経過</dt><dd id="elapsed">0:00</dd></div>
      </dl>
    </section>

    <section class="controls">
      <p class="label">釉薬</p>
      <div class="segmented" role="group" aria-label="釉薬">
        <button id="glaze-seiji" type="button" aria-pressed="true">青磁</button>
        <button id="glaze-kuroraku" type="button" aria-pressed="false">黒楽</button>
      </div>

      <label class="label" for="speed">時の流れ <output id="speed-out">×1.0</output></label>
      <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1" />

      <div class="buttons">
        <button id="sound" type="button" class="ghost" aria-pressed="false">貫入音を聴く</button>
        <button id="refire" type="button" class="primary">再び焼く</button>
      </div>
    </section>
  </main>

  <figure class="unwrap">
    <div id="unwrap-slot"></div>
    <figcaption>釉面展開図 — 器の外側から見込みまで</figcaption>
  </figure>

  <script type="module" src="main.js"></script>
</body>
</html>
